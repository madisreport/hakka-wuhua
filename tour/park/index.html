<html lang="zh-Hant-TW">

<title>園區｜池上客庄特色遊程</title>
<meta name="description" content="池上客庄特色遊程：池上客家文化園區與合作店家的官網、粉專、導航與電話。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#294534;--paper:#F4F0E5;--text:#443D34;--line:#E2D9C8;--card:#FFFDF8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:17px}
body{margin:0;background:var(--paper);color:var(--text);min-height:100vh;
 font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif}
.serif{font-family:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU",serif}
a{color:inherit}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;
 background:rgba(244,240,229,.94);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar .t{flex:1;min-width:0;text-align:center;font-size:1.12rem;font-weight:900;color:var(--ink);letter-spacing:.06em;line-height:1.25}
html[lang=en] .bar .t{font-size:.98rem;letter-spacing:.01em}
.ib{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
 color:var(--ink);background:var(--card);border:1.5px solid var(--line);text-decoration:none}
.ib svg{width:22px;height:22px}
.ib.ghost{visibility:hidden}
.is-home .bar .t{visibility:hidden}
.lang{flex:none;min-width:58px;height:44px;padding:0 12px;border-radius:22px;border:1.5px solid var(--ink);background:var(--ink);
 color:#fff;font-weight:700;font-size:.9rem;letter-spacing:.04em;cursor:pointer;font-family:inherit}
main{max-width:560px;margin:0 auto;padding:0 16px 28px}
/* 首頁 */
.hero{text-align:center;padding:26px 0 0}
.hero h1{margin:0;font-size:2.15rem;line-height:1.25;font-weight:900;color:var(--ink);letter-spacing:.1em}
.hero .en{margin:6px 0 0;font-size:.95rem;color:#6E6556;letter-spacing:.03em}
.hero img{display:block;width:86%;max-width:420px;height:auto;margin:8px auto 4px}
.tiles{display:grid;gap:14px;margin-top:6px}
.tile{position:relative;display:block;border-radius:22px;overflow:hidden;text-decoration:none;color:#fff;aspect-ratio:2.25/1;
 box-shadow:0 6px 18px rgba(41,69,52,.16);background:#ccc}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .sh{position:absolute;inset:0;background:linear-gradient(90deg,var(--c) 0%,var(--c7) 42%,var(--c0) 80%)}
.tile .lb{position:absolute;left:20px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:12px}
.tile .ic{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center}
.tile .ic svg{width:26px;height:26px}
.tile .nm{font-size:1.9rem;font-weight:900;letter-spacing:.14em;line-height:1.1}
html[lang=en] .tile .nm{font-size:1.6rem;letter-spacing:.03em}
html[lang=en] .hero h1{font-size:1.75rem;letter-spacing:.03em}
.tile .go{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;
 background:rgba(255,255,255,.9);color:var(--c);display:flex;align-items:center;justify-content:center}
.tile .go svg{width:20px;height:20px}
/* 分類頁 */
.head{display:flex;align-items:center;gap:12px;margin:22px 2px 14px}
.head .ic{width:46px;height:46px;border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center}
.head .ic svg{width:26px;height:26px}
.head h2{margin:0;font-size:1.75rem;font-weight:900;color:var(--c);letter-spacing:.14em}
.stop{background:var(--card);border-radius:22px;overflow:hidden;margin:0 0 16px;box-shadow:0 4px 14px rgba(41,69,52,.10)}
.ph{position:relative;aspect-ratio:2/1;background:#ddd}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(25,30,24,.72),rgba(25,30,24,0) 58%)}
.ph .nm{position:absolute;left:16px;right:16px;bottom:13px;z-index:1;display:flex;align-items:center;gap:10px;color:#fff;
 font-size:1.32rem;font-weight:700;line-height:1.3;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.ph .nm span[data-zh]{white-space:pre-line}
.ph .no{flex:none;width:30px;height:30px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;
 font-size:.95rem;font-weight:700;font-family:"Noto Sans TC",sans-serif;text-shadow:none}
.acts{display:flex;justify-content:space-around;padding:14px 10px 16px}
.act{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;
 background:var(--ink);color:#fff;text-decoration:none;box-shadow:0 3px 8px rgba(41,69,52,.22)}
.act svg{width:26px;height:26px}
.act:active{transform:scale(.94)}
.foot{margin:22px 0 0;font-size:.82rem;color:#7a6f62;text-align:center;line-height:1.6}
.note{margin:4px 0 0;font-size:.68rem;color:#9a9084;text-align:center}
</style>

<script>
(function(){
  var KEY='chishangTourLang', lang='zh';
  try{var q=new URLSearchParams(location.search).get('lang');if(q==='en'||q==='zh'){lang=q;localStorage.setItem(KEY,q);}else{lang=localStorage.getItem(KEY)||'zh';}}catch(e){}
  function apply(l){
    document.documentElement.lang=(l==='en')?'en':'zh-Hant-TW';
    document.querySelectorAll('[data-zh]').forEach(function(el){el.textContent=el.getAttribute('data-'+l);});
    document.querySelectorAll('[data-zh-label]').forEach(function(el){el.setAttribute('aria-label',el.getAttribute('data-'+l+'-label'));});
    var b=document.getElementById('lang');if(b){b.textContent=(l==='en')?'中文':'EN';b.setAttribute('aria-label',(l==='en')?'切換成中文':'Switch to English');}
    document.title=document.body.getAttribute('data-title-'+l)||document.title;
  }
  apply(lang);
  var b=document.getElementById('lang');
  if(b){b.addEventListener('click',function(){lang=(lang==='en')?'zh':'en';try{localStorage.setItem(KEY,lang);}catch(e){}apply(lang);
    if(window.gtag){gtag('event','tour_lang',{lang:lang});}});}
  document.querySelectorAll('a[data-ev]').forEach(function(a){
    a.addEventListener('click',function(){
      if(!window.gtag)return;
      if(a.getAttribute('data-ev')==='cat'){gtag('event','tour_category',{category:a.getAttribute('data-cat'),lang:lang});}
      else{gtag('event','tour_link',{shop_id:a.getAttribute('data-id'),shop_name:a.getAttribute('data-name'),link_type:a.getAttribute('data-type'),lang:lang});}
    });
  });
})();
</script>
