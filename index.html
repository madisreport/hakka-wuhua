<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F0E5">
<title>客語發音｜跈著花草香，尋客庄</title>
<meta name="description" content="池上客家文化園區展覽：十種花草的客語念法。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#294534;--paper:#F4F0E5;--text:#443D34;--line:#D9D0BF;--soft:#E0E1D2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:20px}
body{margin:0;background:var(--paper);color:var(--text);
 font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
 min-height:100vh;display:flex;flex-direction:column;align-items:center}
.serif{font-family:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU",serif}
main{width:100%;max-width:520px;padding:16px 20px 40px;display:flex;flex-direction:column;align-items:center;flex:1}
.top{width:100%;display:flex;justify-content:flex-start}
.back{display:inline-flex;align-items:center;gap:6px;min-height:52px;padding:0 18px 0 10px;border-radius:26px;
 color:var(--ink);text-decoration:none;font-size:1.05rem;border:2px solid var(--line);background:#fff8}
.back svg{width:26px;height:26px}
.name{margin:28px 0 0;font-size:3.4rem;line-height:1.15;color:var(--ink);font-weight:900;text-align:center;letter-spacing:.04em}
.hakka{margin:10px 0 0;font-size:1.45rem;color:var(--text);text-align:center}
.hakka b{color:var(--ink);font-weight:700}
.pinyin{margin:6px 0 0;font-size:1.7rem;color:var(--ink);text-align:center;letter-spacing:.02em;font-weight:500}
.play{margin:36px 0 0;width:min(72vw,300px);height:min(72vw,300px);border-radius:50%;border:0;cursor:pointer;
 background:var(--ink);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
 box-shadow:0 10px 30px #29453444;transition:transform .12s,box-shadow .12s;touch-action:manipulation}
.play:active{transform:scale(.96);box-shadow:0 4px 14px #29453444}
.play svg{width:34%;height:34%}
.play .lbl{font-size:2.1rem;font-weight:700;letter-spacing:.1em;line-height:1}
.play.on{background:#3f6a52;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #29453455}50%{box-shadow:0 0 0 22px #29453400}}
.hint{margin:22px 0 0;font-size:1.25rem;color:var(--text);text-align:center}
.sent{margin:40px 0 0;width:100%;border-top:2px solid var(--line);padding-top:26px;text-align:center}
.sent .zh{font-size:1.9rem;color:var(--ink);font-weight:700;line-height:1.4}
.sent .py{margin-top:8px;font-size:1.15rem;color:var(--text)}
.play.small{width:min(44vw,180px);height:min(44vw,180px);margin-top:22px}
.play.small .lbl{font-size:1.5rem}
/* 首頁 */
h1{margin:22px 0 4px;font-size:2.3rem;line-height:1.25;color:var(--ink);text-align:center;font-weight:900;letter-spacing:.06em}
.sub{margin:0 0 18px;font-size:1.25rem;color:var(--text);text-align:center}
.grp{width:100%;margin:22px 0 6px;font-size:1.15rem;color:var(--ink);font-weight:700;display:flex;align-items:center;gap:12px}
.grp:after{content:"";flex:1;height:2px;background:var(--line)}
.list{width:100%;display:grid;gap:14px}
.card{display:flex;align-items:center;justify-content:space-between;min-height:88px;padding:0 20px 0 24px;border-radius:18px;
 background:#fff9;border:2px solid var(--line);color:var(--ink);text-decoration:none}
.card .n{font-size:2rem;font-weight:900;letter-spacing:.06em}
.card .p{font-size:1.1rem;color:var(--text);margin-left:12px;flex:1}
.card svg{width:44px;height:44px;flex:none}
.foot{margin-top:auto;padding-top:36px;font-size:.95rem;color:#7a6f62;text-align:center}
</style>
</head>
<body>
<main>
<h1 class="serif">跈著花草香，<br>尋客庄</h1>
<p class="sub">按一下植物名，聽客語怎麼說</p>
<div class="grp">客家五花</div>
<div class="list">
<a class="card" href="f1/"><span class="n serif">含笑</span><span class="p">hamˇ seu</span><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 24h10l14-12v40L20 40H10z" fill="currentColor" stroke="none"/><path d="M42 22c4 5 4 15 0 20"/><path d="M50 14c8 9 8 27 0 36"/></svg></a>
<a class="card" href="f2/"><span class="n serif">夜合</span><span class="p">ia hab</span><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 24h10l14-12v40L20 40H10z" fill="currentColor" stroke="none"/><path d="M42 22c4 5 4 15 0 20"/><path d="M50 14c8 9 8 27 0 36"/></svg></a>
<a class="card" href="f3/"><span class="n serif">樹蘭</span><span class="p">su lanˇ</span><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 24h10l14-12v40L20 40H10z" fill="currentColor" stroke="none"/><path d="M42 22c4 5 4 15 0 20"/><path d="M50 14c8 9 8 27 0 36"/></svg></a>
<a class="card" href="f4/"><span class="n serif">桂花</span><span class="p">gui faˊ</span><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 24h10l14-12v40L20 40H10z" fill="currentColor" stroke="none"/><path d="M42 22c4 5 4 15 0 20"/><path d="M50 14c8 9 8 27 0 36"/></svg></a>
<a class="card" href="f5/"><span class="n serif">新丁花</span><span class="p">xinˊ denˊ faˊ</span><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 24h10l14-12v40L20 40H10z" fill="currentColor" stroke="none"/><path d="M42 22c4 5 4 15 0 20"/><path d="M50 14c8 9 8 27 0 36"/></svg></a>
</div>
<div class="grp">池上的草木</div>
<div class="list">
<a class="card" href="g1/"><span class="n serif">大風草</span><span class="p">tai funˊ coˋ</span><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 24h10l14-12v40L20 40H10z" fill="currentColor" stroke="none"/><path d="M42 22c4 5 4 15 0 20"/><path d="M50 14c8 9 8 27 0 36"/></svg></a>
<a class="card" href="g2/"><span class="n serif">抹草</span><span class="p">madˋ coˋ</span><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 24h10l14-12v40L20 40H10z" fill="currentColor" stroke="none"/><path d="M42 22c4 5 4 15 0 20"/><path d="M50 14c8 9 8 27 0 36"/></svg></a>
<a class="card" href="g3/"><span class="n serif">香茅</span><span class="p">hiongˊ mauˇ</span><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 24h10l14-12v40L20 40H10z" fill="currentColor" stroke="none"/><path d="M42 22c4 5 4 15 0 20"/><path d="M50 14c8 9 8 27 0 36"/></svg></a>
<a class="card" href="g4/"><span class="n serif">艾草</span><span class="p">ngie eˋ</span><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 24h10l14-12v40L20 40H10z" fill="currentColor" stroke="none"/><path d="M42 22c4 5 4 15 0 20"/><path d="M50 14c8 9 8 27 0 36"/></svg></a>
<a class="card" href="g5/"><span class="n serif">黃荊</span><span class="p">sanˊ bu giangˊ</span><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 24h10l14-12v40L20 40H10z" fill="currentColor" stroke="none"/><path d="M42 22c4 5 4 15 0 20"/><path d="M50 14c8 9 8 27 0 36"/></svg></a>
</div>
<p class="foot">客語發音：石湘蓮老師（四縣腔）</p>
</main>
<script></script>
</body>
</html>
